name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          if python -m pytest -q --tb=short > pytest.log 2>&1; then
            cat pytest.log
          else
            status=$?
            cat pytest.log
            grep -E '^(FAILED|ERROR) |^E ' pytest.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi
